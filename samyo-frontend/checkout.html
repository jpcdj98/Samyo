<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout – Samyo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="bottle" viewBox="0 0 100 150"><rect x="38" y="4" width="24" height="26" rx="5" fill="#2A1740"/><rect x="43" y="30" width="14" height="10" fill="#8E7AA8"/><rect x="14" y="40" width="72" height="104" rx="22" fill="var(--bottle)"/><rect x="22" y="52" width="9" height="74" rx="4.5" fill="#fff" opacity=".4"/><rect x="34" y="82" width="44" height="28" rx="4" fill="#fff" opacity=".85"/><rect x="40" y="90" width="32" height="3" rx="1.5" fill="#2A1740"/><rect x="40" y="97" width="20" height="3" rx="1.5" fill="#2A1740" opacity=".5"/></symbol></svg>
<a class="skip-link" href="#main">Skip to content</a>
<div class="container">
  <header class="site-header">
    <a class="brand" href="index.html">Samyo</a>
    <nav class="nav" aria-label="Main"><a class="nav__link" href="shop.html">Shop</a><a class="nav__link" href="orders.html">Orders</a><a class="nav__link" href="login.html">Login</a><a class="nav__link" href="cart.html" aria-current="page">Cart<span class="nav__badge">2</span></a></nav>
  </header>
  <main id="main" class="page">
    <h1 class="page__title" style="font-size:clamp(32px,5vw,48px)">Checkout</h1>
    <form class="split" action="confirmation.html" method="get">
      <div class="panel">
        <fieldset class="form-group"><legend>Contact</legend>
          <div class="form-row">
            <div><label class="sr-only" for="full_name">Full name</label><input class="input" id="full_name" name="full_name" placeholder="Full name" autocomplete="name" required></div>
            <div><label class="sr-only" for="mobile">Mobile</label><input class="input" id="mobile" name="mobile" type="tel" placeholder="Mobile (09XX XXX XXXX)" autocomplete="tel" required></div>
          </div></fieldset>
        <fieldset class="form-group"><legend>Delivery address</legend>
          <label class="sr-only" for="street">Street address</label><input class="input" id="street" name="street" placeholder="House no., street, barangay" autocomplete="street-address" required>
          <div class="form-row">
            <div><label class="sr-only" for="city">City</label><input class="input" id="city" name="city" placeholder="City or municipality" required></div>
            <div><label class="sr-only" for="province">Province</label><select class="input" id="province" name="province"><option>Metro Manila</option><option>Cebu</option><option>Davao del Sur</option><option>Pampanga</option><option>Iloilo</option></select></div>
          </div></fieldset>
        <fieldset class="form-group"><legend>Payment</legend>
          <div class="pay-options">
            <label class="choice"><input type="radio" name="payment" value="gcash" checked><span>GCash</span></label>
            <label class="choice"><input type="radio" name="payment" value="maya"><span>Maya</span></label>
            <label class="choice"><input type="radio" name="payment" value="cod"><span>Cash on delivery</span></label>
          </div></fieldset>
        <button class="btn btn--block" type="submit">Place order · ₱5,210</button>
      </div>
      <aside class="panel" aria-label="Order summary">
        <div class="summary__row"><span>Dalandan · 50 ml × 1</span><span>₱1,490</span></div>
        <div class="summary__row"><span>Barako · 100 ml × 1</span><span>₱3,720</span></div>
        <div class="summary__row"><span>Delivery</span><span>Free</span></div>
        <div class="summary__row summary__total"><span>Total</span><span>₱5,210</span></div>
      </aside>
    </form>
  </main>
  <footer class="site-footer">
    <ul class="perks"><li>Free delivery over ₱1,500</li><li>GCash and Maya</li><li>Cash on delivery</li></ul>
    <p>© 2026 Samyo · Made in the Philippines</p>
  </footer>
</div>
</body>
</html>
