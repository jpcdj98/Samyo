<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – Samyo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="bottle" viewBox="0 0 100 150"><rect x="38" y="4" width="24" height="26" rx="5" fill="#2A1740"/><rect x="43" y="30" width="14" height="10" fill="#8E7AA8"/><rect x="14" y="40" width="72" height="104" rx="22" fill="var(--bottle)"/><rect x="22" y="52" width="9" height="74" rx="4.5" fill="#fff" opacity=".4"/><rect x="34" y="82" width="44" height="28" rx="4" fill="#fff" opacity=".85"/><rect x="40" y="90" width="32" height="3" rx="1.5" fill="#2A1740"/><rect x="40" y="97" width="20" height="3" rx="1.5" fill="#2A1740" opacity=".5"/></symbol></svg>
<a class="skip-link" href="#main">Skip to content</a>
<div class="container">
  <header class="site-header">
    <a class="brand" href="index.html">Samyo</a>
    <nav class="nav" aria-label="Main"><a class="nav__link" href="shop.html">Shop</a><a class="nav__link" href="orders.html">Orders</a><a class="nav__link" href="login.html" aria-current="page">Login</a><a class="nav__link" href="cart.html">Cart<span class="nav__badge">2</span></a></nav>
  </header>
  <main id="main" class="page">
    <section class="auth">
      <div class="panel auth__card">
        <h1 class="auth__title">Welcome back</h1>
        <p class="muted" style="margin:8px 0 22px">Log in to see your orders.</p>
        <form id="login-form" action="/api/auth/login" method="post" novalidate>
          <label class="label" for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required>
          <label class="label" for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
          <p class="form-message" id="login-message" role="alert"></p>
          <button class="btn btn--block" type="submit">Log in</button>
        </form>
        <p class="muted auth__hint">Demo account: demo@samyo.ph / Samyo123!</p>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <ul class="perks"><li>Free delivery over ₱1,500</li><li>GCash and Maya</li><li>Cash on delivery</li></ul>
    <p>© 2026 Samyo · Made in the Philippines</p>
  </footer>
</div>
  <script src="js/login.js"></script>
</body>
</html>
